# permissions for end users to view clusterspiffeidsets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusterspiffeidset-viewer-role
rules:
- apiGroups:
  - spire.spiffe.io
  resources:
  - clusterspiffeidsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - spire.spiffe.io
  resources:
  - clusterspiffeidsets/status
  verbs:
  - get
